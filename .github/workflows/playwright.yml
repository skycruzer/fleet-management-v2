name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # Always run: build validation, type-check, lint, format
  validate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create minimal env for build
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key" >> .env.local
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> .env.local

      - name: Run validation (type-check + lint + format)
        run: npm run validate

      # Always run: unit tests gate every push. The E2E job below is conditional on secrets, so
      # without this a green CI run only proved the project compiles, not that it behaves.
      - name: Run unit tests
        run: npm run test:unit

      # The date validators compare a YYYY-MM-DD form value against the LOCAL calendar date.
      # The bug they guard (same-day leave rejected) only manifests at a NEGATIVE UTC offset,
      # and CI runners default to UTC — so the default run above passes either way. Re-run that
      # suite pinned to a negative offset, otherwise the regression is not actually covered.
      - name: Run timezone regression under a negative UTC offset
        run: npm run test:unit:tz

      - name: Run production build
        run: npm run build

  # E2E exercises create/update/delete workflows. Require a dedicated database
  # and test accounts, and fail closed if the configured test URL is production.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - name: Check for isolated E2E secrets
        id: check
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_PILOT_EMAIL: ${{ secrets.E2E_PILOT_EMAIL }}
          E2E_PILOT_STAFF_ID: ${{ secrets.E2E_PILOT_STAFF_ID }}
          E2E_PILOT_PASSWORD: ${{ secrets.E2E_PILOT_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          required=(
            E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY E2E_SUPABASE_SERVICE_ROLE_KEY
            E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_PILOT_EMAIL E2E_PILOT_STAFF_ID
            E2E_PILOT_PASSWORD E2E_USER_EMAIL E2E_USER_PASSWORD PRODUCTION_SUPABASE_URL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "has-secrets=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping E2E tests - $name is not configured"
              exit 0
            fi
          done

          if [ "$E2E_SUPABASE_URL" = "$PRODUCTION_SUPABASE_URL" ]; then
            echo "::error::E2E_SUPABASE_URL must not point at the production Supabase project"
            exit 1
          fi

          echo "has-secrets=true" >> "$GITHUB_OUTPUT"

  # E2E tests: only run when Supabase secrets are configured
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: [validate, check-secrets]
    if: needs.check-secrets.outputs.has-secrets == 'true'
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Setup environment variables
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          PILOT_EMAIL: ${{ secrets.E2E_PILOT_EMAIL }}
          PILOT_STAFF_ID: ${{ secrets.E2E_PILOT_STAFF_ID }}
          PILOT_PASSWORD: ${{ secrets.E2E_PILOT_PASSWORD }}
          USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env.local
          echo "TEST_ADMIN_EMAIL=$ADMIN_EMAIL" >> .env.test.local
          echo "TEST_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> .env.test.local
          echo "TEST_PILOT_EMAIL=$PILOT_EMAIL" >> .env.test.local
          echo "TEST_PILOT_STAFF_ID=$PILOT_STAFF_ID" >> .env.test.local
          echo "TEST_PILOT_PASSWORD=$PILOT_PASSWORD" >> .env.test.local
          echo "TEST_USER_EMAIL=$USER_EMAIL" >> .env.test.local
          echo "TEST_USER_PASSWORD=$USER_PASSWORD" >> .env.test.local
          echo "PLAYWRIGHT_TEST_BASE_URL=http://localhost:3005" >> .env.test.local
          echo "E2E_TEST_DATABASE=1" >> .env.test.local

      - name: Run Playwright tests
        run: npm test
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.node-version }}
          path: test-results/
          retention-days: 30
